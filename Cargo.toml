[workspace]
resolver = "3"
members = [
    "crates/mol-graph",
    "crates/mol-vector",
    "crates/mol-sar",
    "crates/mol-admet-bridge",
    "crates/mol-synth",
    "crates/mol-peptide",
    "crates/mol-engine",
    "apps/chemcraft-cli",
    "apps/chemcraft",
    "xtask",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
libc = "0.2"
rustix = { version = "1", features = ["fs"] }
flate2 = "1.1"
crc32fast = "1.5"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
png = "0.18"
eframe = "0.31"
egui = "0.31"
craftbio-scene = { git = "https://github.com/acs-foundry/craftbio-libs", tag = "v1.1.2" }
craftbio-report = { git = "https://github.com/acs-foundry/craftbio-libs", tag = "v1.1.2" }

[profile.release]
overflow-checks = true
